version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - npm_default

  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    networks:
      - npm_default

  medusa:
    image: ghcr.io/oplayid/medusa-backend:latest
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    expose:
      - "9000"
      - "5173"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/medusa-store
      - REDIS_URL=redis://redis:6379
    networks:
      - npm_default

  storefront:
    image: ghcr.io/oplayid/medusa-storefront:latest
    container_name: medusa_storefront
    restart: unless-stopped
    depends_on:
      - medusa
    expose:
      - "8000"
    environment:
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api-toko.oplay.id   # Sesuaikan domain backend Anda di NPM
    networks:
      - npm_default

volumes:
  postgres_data:

networks:
  npm_default:
    external: true
    name: npm_default