name: Build and Push Medusa Images

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/medusa-backend:latest

      - name: Build and Push Storefront
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.storefront
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/medusa-storefront:latest